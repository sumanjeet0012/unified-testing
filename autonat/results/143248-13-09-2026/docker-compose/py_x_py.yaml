name: an_py_x_py

networks:
  default:
    name: transport-network
    external: true

services:
  server:
    image: "autonat-py"
    container_name: an_py_x_py_server
    init: true
    environment:
      - ROLE=server
      - REDIS_ADDR=transport-redis:6379
      - TEST_KEY=f45a0b2e

  client:
    image: "autonat-py"
    container_name: an_py_x_py_client
    init: true
    depends_on:
      - server
    environment:
      - ROLE=client
      - REDIS_ADDR=transport-redis:6379
      - TEST_KEY=f45a0b2e
