name: rz_py_x_py_x_py

networks:
  default:
    name: transport-network
    external: true

services:
  server:
    image: "rendezvous-py"
    container_name: rz_py_x_py_x_py_server
    init: true
    environment:
      - ROLE=server
      - REDIS_ADDR=transport-redis:6379
      - TEST_KEY=7213833b

  registrant:
    image: "rendezvous-py"
    container_name: rz_py_x_py_x_py_registrant
    init: true
    depends_on:
      - server
    environment:
      - ROLE=registrant
      - REDIS_ADDR=transport-redis:6379
      - TEST_KEY=7213833b

  discoverer:
    image: "rendezvous-py"
    container_name: rz_py_x_py_x_py_discoverer
    init: true
    depends_on:
      - server
      - registrant
    environment:
      - ROLE=discoverer
      - REDIS_ADDR=transport-redis:6379
      - TEST_KEY=7213833b
