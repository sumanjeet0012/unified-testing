name: rz_py_x_go_x_go

networks:
  default:
    name: transport-network
    external: true

services:
  server:
    image: "rendezvous-py"
    container_name: rz_py_x_go_x_go_server
    init: true
    environment:
      - ROLE=server
      - REDIS_ADDR=transport-redis:6379
      - TEST_KEY=c4bae73d

  registrant:
    image: "rendezvous-go"
    container_name: rz_py_x_go_x_go_registrant
    init: true
    depends_on:
      - server
    environment:
      - ROLE=registrant
      - REDIS_ADDR=transport-redis:6379
      - TEST_KEY=c4bae73d

  discoverer:
    image: "rendezvous-go"
    container_name: rz_py_x_go_x_go_discoverer
    init: true
    depends_on:
      - server
      - registrant
    environment:
      - ROLE=discoverer
      - REDIS_ADDR=transport-redis:6379
      - TEST_KEY=c4bae73d
